name: Update OONI evidence

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ooni-evidence-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test collector
        run: python3 -m unittest discover -s tests -v

      - name: Collect current evidence and advance historical backfill
        run: python3 scripts/update_ooni.py

      - name: Validate repository
        run: python3 scripts/validate.py

      - name: Commit data changes
        run: |
          if git diff --quiet && test -z "$(git status --porcelain)"; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "dotyemen data bot"
          git config user.email "dotyemen@users.noreply.github.com"
          git add data state
          git commit -m "data: update OONI evidence"
          git push
